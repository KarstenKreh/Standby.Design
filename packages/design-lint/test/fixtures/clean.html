<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style>
:root { --text-sm: 14px; --text-base: 16px; --text-lg: 18px; --text-xl: 20px; --text-2xl: 24px; --text-3xl: 30px; --text-4xl: 36px; }
body { font-family: Arial, sans-serif; font-size: var(--text-base); color: rgb(20, 20, 20); margin: 24px; }
.text-role-title { font-size: var(--text-3xl); font-weight: 700; }
.text-role-label { font-size: var(--text-sm); font-weight: 600; }
.text-role-figure { font-size: var(--text-4xl); font-weight: 400; }
.text-role-body { font-size: var(--text-base); }
.text-role-meta { font-size: var(--text-sm); color: rgb(110, 110, 110); }
</style></head><body>
<h1 class="text-role-title">Übersicht</h1>
<p class="text-role-label">Umsatz</p><p class="text-role-figure">14,2 Mio. €</p><p class="text-role-meta">seit Januar</p>
<p class="text-role-label">Kosten</p><p class="text-role-figure">9,1 Mio. €</p><p class="text-role-meta">seit Januar</p>
<p class="text-role-body">Miete Oktober</p><p class="text-role-body">Strom Oktober</p>
</body></html>
